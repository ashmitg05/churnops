name: Retrain

on:
  workflow_dispatch:  # manual, or dispatched by the drift monitor
    inputs:
      reason:
        description: Why retraining was triggered
        default: manual
  schedule:
    - cron: "0 3 * * 1"  # weekly, Monday 03:00 UTC

permissions:
  contents: write  # commit the new model pointer

jobs:
  retrain:
    runs-on: ubuntu-latest
    env:
      DAGSHUB_USER: ${{ vars.DAGSHUB_USER }}
      DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
    outputs:
      promoted: ${{ steps.promote.outputs.promoted }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: ./.github/actions/dagshub
      # Untrusted text goes through env, never interpolated into the script (injection-safe).
      - name: Reason
        env:
          REASON: ${{ inputs.reason || 'schedule' }}
        run: echo "Retrain reason: $REASON"
      - name: Pull data + current production model
        # First run: remote is empty, so repro rebuilds everything from the public source.
        run: dvc pull || echo "remote empty or partial; dvc repro will rebuild"
      - name: Run pipeline (only changed stages rebuild)
        run: dvc repro
      - name: Store data + pipeline outputs on DagsHub
        run: dvc push
      - name: Promotion gate
        id: promote
        run: python -m src.registry.promote
      - uses: actions/upload-artifact@v4
        with:
          name: retrain-reports
          path: reports/
      - name: Version promoted model
        if: steps.promote.outputs.promoted == 'true'
        env:
          REASON: ${{ inputs.reason || 'schedule' }}
        run: |
          dvc add models/model.joblib
          dvc push
          git config user.name "churnops-bot"
          git config user.email "churnops-bot@users.noreply.github.com"
          git add models/model.joblib.dvc dvc.lock reports/promotion.json reports/metrics.json reports/model_comparison.md
          git commit -m "chore: promote model ($REASON)"
          git push

  deploy:
    needs: retrain
    if: needs.retrain.outputs.promoted == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
