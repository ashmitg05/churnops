name: Deploy

on:
  push:
    branches: [main]
    paths: [src/**, params.yaml, Dockerfile, requirements-serve.txt, models/model.joblib.dvc, reports/*.json]
  workflow_call:  # called by retrain.yml after a promotion
    secrets:
      DAGSHUB_TOKEN: {required: true}
      RENDER_DEPLOY_HOOK: {required: false}
  workflow_dispatch:

permissions:
  contents: read
  packages: write  # push to GitHub Container Registry

concurrency: deploy  # never two deploys racing

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/churnops-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DAGSHUB_USER: ${{ vars.DAGSHUB_USER }}
      DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # after retrain, main holds the freshly promoted model pointer
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "dvc==3.58.0" "pathspec==0.12.1"
      - uses: ./.github/actions/dagshub
      - name: Pull production model
        run: dvc pull models/model.joblib
      - name: Build and push image to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
      # Render (free web service) redeploys :latest when its deploy hook is called.
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "RENDER_DEPLOY_HOOK not set; image pushed only"; exit 0; fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Render deploy triggered"
