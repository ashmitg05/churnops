name: Deploy

on:
  push:
    branches: [main]
    paths: [src/**, params.yaml, Dockerfile, requirements-serve.txt, models/model.joblib.dvc, reports/*.json]
  workflow_call:  # called by retrain.yml after a promotion
    secrets:
      HF_TOKEN: {required: true}
      DAGSHUB_TOKEN: {required: true}
      DATABASE_URL: {required: true}
      BATCH_API_KEY: {required: true}
  workflow_dispatch:

permissions:
  contents: read

concurrency: deploy  # never two deploys racing on the Space

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DAGSHUB_USER: ${{ vars.DAGSHUB_USER }}
      DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # after retrain, main holds the freshly promoted model pointer
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "dvc==3.58.0" "pathspec==0.12.1" "huggingface_hub==0.27.1"
      - uses: ./.github/actions/dagshub
      - name: Pull production model
        run: dvc pull models/model.joblib
      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BATCH_API_KEY: ${{ secrets.BATCH_API_KEY }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
        run: python scripts/deploy_space.py
