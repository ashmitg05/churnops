name: Monitor drift

on:
  schedule:
    - cron: "0 6 * * *"  # daily
  workflow_dispatch:

permissions:
  contents: read
  actions: write  # needed to dispatch retrain.yml

jobs:
  drift:
    runs-on: ubuntu-latest
    env:
      DAGSHUB_USER: ${{ vars.DAGSHUB_USER }}
      DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: ./.github/actions/dagshub
      - run: dvc pull data/processed
      - name: Drift check (dispatches retrain.yml if over threshold)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m src.monitoring.drift
      - uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: reports/drift.*
